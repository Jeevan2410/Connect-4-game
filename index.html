<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect 4 - 3D Clip Art Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient-1: #667eea;
            --bg-gradient-2: #764ba2;
            --bg-gradient-3: #f093fb;
            --board-frame: #FF6B6B;
            --board-inner: #4ECDC4;
            --p1-color: #FFE66D;
            --p2-color: #FF9F43;
            --outline: #2d3436;
            --shadow-dark: rgba(0, 0, 0, 0.3);
            --shadow-light: rgba(255, 255, 255, 0.4);
            --paper-white: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 50%, var(--bg-gradient-3) 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            perspective: 1000px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animated Background Elements */
        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float3D 20s infinite ease-in-out;
            box-shadow: 
                inset 10px 10px 20px rgba(255,255,255,0.2),
                inset -10px -10px 20px rgba(0,0,0,0.1);
        }

        .shape:nth-child(1) { width: 150px; height: 150px; top: 10%; left: 10%; animation-delay: 0s; }
        .shape:nth-child(2) { width: 200px; height: 200px; top: 70%; left: 80%; animation-delay: -5s; }
        .shape:nth-child(3) { width: 100px; height: 100px; top: 40%; left: 60%; animation-delay: -10s; }
        .shape:nth-child(4) { width: 180px; height: 180px; top: 80%; left: 20%; animation-delay: -15s; }
        .shape:nth-child(5) { width: 120px; height: 120px; top: 20%; left: 90%; animation-delay: -7s; }

        @keyframes float3D {
            0%, 100% { transform: translate3d(0, 0, 0) rotateX(0deg) rotateY(0deg); }
            25% { transform: translate3d(20px, -30px, 50px) rotateX(10deg) rotateY(5deg); }
            50% { transform: translate3d(-15px, 20px, -30px) rotateX(-5deg) rotateY(-10deg); }
            75% { transform: translate3d(30px, 10px, 40px) rotateX(15deg) rotateY(-5deg); }
        }

        /* --- Clip Art Header --- */
        header {
            text-align: center;
            margin: 20px 0;
            position: relative;
            z-index: 10;
            transform-style: preserve-3d;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 4rem;
            color: var(--p1-color);
            text-shadow: 
                4px 4px 0px var(--outline),
                8px 8px 20px var(--shadow-dark);
            margin: 0;
            letter-spacing: 3px;
            transform: rotate(-3deg);
            animation: titleFloat 3s ease-in-out infinite;
            position: relative;
        }

        h1::before {
            content: 'CONNECT 4';
            position: absolute;
            left: 4px;
            top: 4px;
            color: var(--p2-color);
            z-index: -1;
            opacity: 0.5;
        }

        @keyframes titleFloat {
            0%, 100% { transform: rotate(-3deg) translateY(0); }
            50% { transform: rotate(-3deg) translateY(-10px); }
        }

        .subtitle {
            font-size: 1.3rem;
            color: var(--outline);
            background: var(--paper-white);
            padding: 8px 20px;
            border: 4px solid var(--outline);
            border-radius: 25px;
            display: inline-block;
            box-shadow: 
                6px 6px 0px var(--outline),
                10px 10px 20px var(--shadow-dark);
            margin-top: 15px;
            transform: rotate(2deg);
            font-weight: 900;
            transition: transform 0.3s;
        }

        .subtitle:hover {
            transform: rotate(2deg) scale(1.05);
        }

        /* --- Game Container --- */
        .game-container {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        /* --- The Board --- */
        .board-wrapper {
            position: relative;
            padding: 20px;
            background: linear-gradient(145deg, var(--board-frame), #ff5252);
            border: 6px solid var(--outline);
            border-radius: 25px;
            box-shadow: 
                15px 15px 0px var(--outline),
                20px 20px 40px var(--shadow-dark),
                inset 5px 5px 10px var(--shadow-light);
            transform: rotate(1deg) perspective(500px);
            transform-style: preserve-3d;
            transition: transform 0.3s;
        }

        .board-wrapper:hover {
            transform: rotate(1deg) perspective(500px) translateZ(10px);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
            background: linear-gradient(180deg, var(--board-inner), #3dbdb5);
            padding: 15px;
            border-radius: 20px;
            border: 4px solid var(--outline);
            box-shadow: inset 5px 5px 15px rgba(0,0,0,0.3);
        }

        .cell {
            width: 65px;
            height: 65px;
            background: radial-gradient(circle at 30% 30%, #2a2a2a, #1a1a1a);
            border-radius: 50%;
            border: 5px solid var(--outline);
            box-shadow: 
                inset 5px 5px 15px rgba(0,0,0,0.5),
                inset -3px -3px 10px rgba(255,255,255,0.1);
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            overflow: hidden;
        }

        .cell::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            background: radial-gradient(circle at 40% 40%, rgba(255,255,255,0.1), transparent);
            border-radius: 50%;
        }

        .cell:hover {
            background: radial-gradient(circle at 30% 30%, #3a3a3a, #2a2a2a);
            transform: scale(1.05);
            box-shadow: 
                inset 5px 5px 15px rgba(0,0,0,0.5),
                0 0 20px rgba(255, 230, 109, 0.5);
        }

        .cell.column-hover {
            animation: columnPulse 0.5s ease-in-out infinite;
        }

        @keyframes columnPulse {
            0%, 100% { box-shadow: inset 5px 5px 15px rgba(0,0,0,0.5), 0 0 15px rgba(255, 230, 109, 0.3); }
            50% { box-shadow: inset 5px 5px 15px rgba(0,0,0,0.5), 0 0 30px rgba(255, 230, 109, 0.8); }
        }

        /* --- The Pieces (3D Stickers) --- */
        .piece {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid var(--outline);
            position: absolute;
            top: 0;
            left: 0;
            animation: dropIn3D 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .piece.p1 {
            background: radial-gradient(circle at 30% 30%, #fff5cc, var(--p1-color));
            box-shadow: 
                5px 5px 15px var(--shadow-dark),
                inset 3px 3px 10px rgba(255,255,255,0.5),
                inset -3px -3px 10px rgba(0,0,0,0.2);
        }

        .piece.p2 {
            background: radial-gradient(circle at 30% 30%, #ffe0cc, var(--p2-color));
            box-shadow: 
                5px 5px 15px var(--shadow-dark),
                inset 3px 3px 10px rgba(255,255,255,0.5),
                inset -3px -3px 10px rgba(0,0,0,0.2);
        }

        .piece::after {
            content: '';
            position: absolute;
            width: 40%;
            height: 40%;
            background: radial-gradient(circle, rgba(255,255,255,0.8), transparent);
            border-radius: 50%;
            top: 15%;
            left: 15%;
        }

        /* Winner Star Sticker */
        .piece.winner::before {
            content: '★';
            font-size: 35px;
            color: white;
            text-shadow: 
                3px 3px 0 var(--outline),
                0 0 20px gold;
            animation: popStar 0.5s ease-out forwards, starGlow 1s ease-in-out infinite alternate;
            z-index: 10;
        }

        @keyframes dropIn3D {
            0% { 
                transform: translateY(-500px) rotateZ(720deg) scale(0.5);
                opacity: 0;
            }
            50% {
                transform: translateY(50px) rotateZ(360deg) scale(1.1);
                opacity: 1;
            }
            70% {
                transform: translateY(-20px) rotateZ(180deg) scale(0.95);
            }
            100% { 
                transform: translateY(0) rotateZ(0deg) scale(1);
            }
        }

        @keyframes popStar {
            0% { transform: scale(0) rotate(0deg); }
            50% { transform: scale(1.6) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }

        @keyframes starGlow {
            0% { filter: drop-shadow(0 0 5px gold); }
            100% { filter: drop-shadow(0 0 20px gold); }
        }

        /* --- Sidebar UI --- */
        .sidebar {
            background: var(--paper-white);
            border: 6px solid var(--outline);
            border-radius: 25px;
            padding: 25px;
            width: 280px;
            box-shadow: 
                12px 12px 0px var(--outline),
                20px 20px 40px var(--shadow-dark);
            display: flex;
            flex-direction: column;
            gap: 25px;
            transform: rotate(-1deg);
        }

        .status-card {
            text-align: center;
            border: 4px dashed var(--outline);
            border-radius: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            box-shadow: inset 3px 3px 10px rgba(0,0,0,0.1);
        }

        .turn-indicator {
            font-family: 'Fredoka One', cursive;
            font-size: 1.6rem;
            margin-bottom: 15px;
            color: var(--outline);
            text-shadow: 2px 2px 0 rgba(255,255,255,0.5);
        }

        .current-player-token {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 5px solid var(--outline);
            margin: 0 auto;
            box-shadow: 
                5px 5px 15px var(--shadow-dark),
                inset 3px 3px 10px rgba(255,255,255,0.5);
            animation: tokenPulse 1.5s ease-in-out infinite;
        }

        @keyframes tokenPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            font-weight: 900;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #fff, #f0f0f0);
            padding: 15px;
            border-radius: 15px;
            border: 3px solid var(--outline);
        }

        .score-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .mini-token {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid var(--outline);
            box-shadow: 2px 2px 5px var(--shadow-dark);
        }

        /* --- Buttons --- */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            padding: 15px 20px;
            border: 4px solid var(--outline);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
            top: 0;
            box-shadow: 
                6px 6px 0px var(--outline),
                10px 10px 20px var(--shadow-dark);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 
                9px 9px 0px var(--outline),
                15px 15px 30px var(--shadow-dark);
        }

        button:active {
            top: 6px;
            box-shadow: 
                0px 0px 0px var(--outline),
                2px 2px 10px var(--shadow-dark);
        }

        .btn-reset { 
            background: linear-gradient(145deg, #FF6B6B, #ff5252); 
            color: white;
        }
        .btn-undo { 
            background: linear-gradient(145deg, #4ECDC4, #3dbdb5); 
            color: white;
        }

        /* --- Modal --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal {
            background: var(--paper-white);
            border: 8px solid var(--outline);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            box-shadow: 
                20px 20px 0px var(--outline),
                30px 30px 60px var(--shadow-dark);
            animation: popModal3D 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 90%;
            transform-style: preserve-3d;
        }

        @keyframes popModal3D {
            0% { 
                transform: scale(0.3) rotate(-20deg) translateZ(-500px); 
                opacity: 0; 
            }
            100% { 
                transform: scale(1) rotate(0deg) translateZ(0); 
                opacity: 1; 
            }
        }

        .modal h2 {
            font-family: 'Fredoka One', cursive;
            font-size: 3rem;
            color: var(--board-frame);
            text-shadow: 
                4px 4px 0 var(--outline),
                0 0 30px currentColor;
            margin: 0 0 25px 0;
            animation: modalTitleBounce 1s ease-in-out infinite;
        }

        @keyframes modalTitleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .modal p {
            font-size: 1.4rem;
            margin-bottom: 30px;
            color: var(--outline);
            font-weight: 700;
        }

        /* Particle Canvas */
        #particle-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* Column Indicators */
        .column-numbers {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
            padding: 0 15px;
            margin-bottom: 10px;
        }

        .col-num {
            text-align: center;
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            color: white;
            background: var(--outline);
            border-radius: 10px;
            padding: 5px 0;
            box-shadow: 2px 2px 5px var(--shadow-dark);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .cell { width: 50px; height: 50px; }
            h1 { font-size: 3rem; }
            .game-container { flex-direction: column; align-items: center; }
            .sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; justify-content: center; }
            .btn-group { flex-direction: row; }
            button { flex: 1; }
        }

        @media (max-width: 600px) {
            .cell { width: 40px; height: 40px; }
            .board { gap: 8px; padding: 10px; }
            h1 { font-size: 2.5rem; }
        }

        /* Spark Effect */
        .spark {
            position: absolute;
            width: 8px;
            height: 8px;
            background: gold;
            border-radius: 50%;
            pointer-events: none;
            animation: sparkFly 0.8s ease-out forwards;
        }

        @keyframes sparkFly {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Animated Background -->
    <div class="bg-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <canvas id="particle-canvas"></canvas>

    <header>
        <h1>CONNECT 4</h1>
        <div class="subtitle">🎮 3D Clip Art Edition 🎮</div>
    </header>

    <div class="game-container">
        <!-- Game Board -->
        <div>
            <div class="column-numbers" id="column-numbers">
                <!-- Generated by JS -->
            </div>
            <div class="board-wrapper">
                <div class="board" id="board">
                    <!-- Cells generated by JS -->
                </div>
            </div>
        </div>

        <!-- Sidebar Controls -->
        <div class="sidebar">
            <div class="status-card">
                <div class="turn-indicator" id="turn-text">Player 1's Turn</div>
                <div class="current-player-token" id="turn-token" style="background: radial-gradient(circle at 30% 30%, #fff5cc, var(--p1-color));"></div>
            </div>

            <div class="score-board">
                <div class="score-item">
                    <div class="mini-token" style="background: radial-gradient(circle at 30% 30%, #fff5cc, var(--p1-color));"></div>
                    <span>P1: <span id="score-p1">0</span></span>
                </div>
                <div class="score-item">
                    <div class="mini-token" style="background: radial-gradient(circle at 30% 30%, #ffe0cc, var(--p2-color));"></div>
                    <span>P2: <span id="score-p2">0</span></span>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn-undo" onclick="game.undo()">↩ Undo (Ctrl+Z)</button>
                <button class="btn-reset" onclick="game.resetGame()">🔄 New Game (Ctrl+R)</button>
            </div>
            
            <div style="font-size: 0.85rem; text-align: center; color: #555; margin-top: 10px; font-weight: 700;">
                🖱️ Click column or press 1-7<br>First to connect 4 wins!
            </div>
        </div>
    </div>

    <!-- Win Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h2 id="modal-title">PLAYER 1 WINS!</h2>
            <p id="modal-message">Awesome victory!</p>
            <button class="btn-reset" onclick="game.resetGame()">🎮 Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

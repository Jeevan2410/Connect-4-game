<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clip Art Connect 4</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFF5E4;
            --board-frame: #FF6B6B;
            --board-hole: #4ECDC4;
            --p1-color: #FFE66D; /* Yellow Sticker */
            --p2-color: #FF9F43; /* Orange Sticker */
            --outline: #2d3436;
            --shadow: rgba(0, 0, 0, 0.2);
            --paper-white: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 107, 107, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(78, 205, 196, 0.1) 0%, transparent 20%);
            font-family: 'Nunito', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Clip Art Header --- */
        header {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 3.5rem;
            color: var(--board-frame);
            text-shadow: 3px 3px 0px var(--outline);
            margin: 0;
            letter-spacing: 2px;
            transform: rotate(-2deg);
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--outline);
            background: var(--paper-white);
            padding: 5px 15px;
            border: 3px solid var(--outline);
            border-radius: 20px;
            display: inline-block;
            box-shadow: 4px 4px 0px var(--shadow);
            margin-top: 10px;
            transform: rotate(1deg);
        }

        /* --- Game Container --- */
        .game-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }

        /* --- The Board --- */
        .board-wrapper {
            position: relative;
            padding: 15px;
            background: var(--board-frame);
            border: 4px solid var(--outline);
            border-radius: 20px;
            box-shadow: 8px 8px 0px var(--shadow);
            transform: rotate(1deg);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            background-color: var(--board-frame);
            padding: 10px;
            border-radius: 15px;
        }

        .cell {
            width: 60px;
            height: 60px;
            background-color: var(--bg-color); /* Shows through hole */
            border-radius: 50%;
            border: 4px solid var(--outline);
            box-shadow: inset 4px 4px 0px rgba(0,0,0,0.1);
            position: relative;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .cell:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* --- The Pieces (Stickers) --- */
        .piece {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid var(--outline);
            position: absolute;
            top: 0;
            left: 0;
            animation: dropIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .piece.p1 {
            background-color: var(--p1-color);
        }

        .piece.p2 {
            background-color: var(--p2-color);
        }

        /* Winner Star Sticker */
        .piece.winner::after {
            content: '★';
            font-size: 30px;
            color: white;
            text-shadow: 2px 2px 0 var(--outline);
            animation: popStar 0.4s ease-out forwards;
        }

        @keyframes dropIn {
            0% { transform: translateY(-400px) rotate(0deg); opacity: 0; }
            60% { transform: translateY(20px) rotate(10deg); opacity: 1; }
            80% { transform: translateY(-10px) rotate(-5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        @keyframes popStar {
            0% { transform: scale(0); }
            80% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }

        /* --- Sidebar UI --- */
        .sidebar {
            background: var(--paper-white);
            border: 4px solid var(--outline);
            border-radius: 20px;
            padding: 20px;
            width: 250px;
            box-shadow: 8px 8px 0px var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .status-card {
            text-align: center;
            border: 3px dashed var(--outline);
            border-radius: 15px;
            padding: 15px;
            background: #f0f0f0;
        }

        .turn-indicator {
            font-family: 'Fredoka One', cursive;
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--outline);
        }

        .current-player-token {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid var(--outline);
            margin: 0 auto;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .score-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .mini-token {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--outline);
        }

        /* --- Buttons --- */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            font-family: 'Fredoka One', cursive;
            font-size: 1.1rem;
            padding: 12px;
            border: 3px solid var(--outline);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.1s;
            position: relative;
            top: 0;
            box-shadow: 4px 4px 0px var(--outline);
        }

        button:active {
            top: 4px;
            box-shadow: 0px 0px 0px var(--outline);
        }

        .btn-reset { background: #FF6B6B; color: white; }
        .btn-undo { background: #4ECDC4; color: white; }
        .btn-mode { background: #FFE66D; color: var(--outline); }

        /* --- Modal --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(2px);
        }

        .modal {
            background: var(--paper-white);
            border: 5px solid var(--outline);
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            box-shadow: 15px 15px 0px var(--shadow);
            animation: popModal 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90%;
        }

        @keyframes popModal {
            0% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .modal h2 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            color: var(--board-frame);
            text-shadow: 2px 2px 0 var(--outline);
            margin: 0 0 20px 0;
        }

        .modal p {
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: var(--outline);
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 99;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .cell { width: 40px; height: 40px; }
            h1 { font-size: 2.5rem; }
            .game-container { flex-direction: column; align-items: center; }
            .sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; justify-content: center; }
            .btn-group { flex-direction: row; }
            button { flex: 1; }
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <header>
        <h1>CONNECT 4</h1>
        <div class="subtitle">Sticker Edition!</div>
    </header>

    <div class="game-container">
        <!-- Game Board -->
        <div class="board-wrapper">
            <div class="board" id="board">
                <!-- Cells generated by JS -->
            </div>
        </div>

        <!-- Sidebar Controls -->
        <div class="sidebar">
            <div class="status-card">
                <div class="turn-indicator" id="turn-text">Player 1's Turn</div>
                <div class="current-player-token" id="turn-token" style="background: var(--p1-color);"></div>
            </div>

            <div class="score-board">
                <div class="score-item">
                    <div class="mini-token" style="background: var(--p1-color);"></div>
                    <span>P1: <span id="score-p1">0</span></span>
                </div>
                <div class="score-item">
                    <div class="mini-token" style="background: var(--p2-color);"></div>
                    <span>P2: <span id="score-p2">0</span></span>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn-undo" onclick="game.undo()">↩ Undo</button>
                <button class="btn-reset" onclick="game.resetGame()">🔄 New Game</button>
            </div>
            
            <div style="font-size: 0.8rem; text-align: center; color: #666; margin-top: 10px;">
                Click column to drop!<br>First to 4 wins.
            </div>
        </div>
    </div>

    <!-- Win Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h2 id="modal-title">PLAYER 1 WINS!</h2>
            <p id="modal-message">Awesome job collecting those stickers!</p>
            <button class="btn-reset" onclick="game.resetGame()">Play Again 🎮</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

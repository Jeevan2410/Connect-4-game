<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Clip-Art Connect 4 Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #2c3e50;
            --board-color: #f1c40f;
            --board-shadow: #d35400;
            --p1-color: #e74c3c;
            --p1-outline: #922b21;
            --p2-color: #3498db;
            --p2-outline: #1a5276;
            --slot-color: #2c3e50;
            --text-color: #ecf0f1;
            --accent: #f39c12;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .bg-shape {
            position: absolute;
            opacity: 0.3;
            z-index: -1;
            filter: blur(2px);
            animation: float3D 20s infinite linear;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.3);
        }
        .shape-cube { width: 100px; height: 100px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); top: 10%; left: 10%; transform-style: preserve-3d; }
        .shape-sphere { width: 150px; height: 150px; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2), transparent); border-radius: 50%; top: 70%; right: 10%; }
        .shape-pyramid { width: 0; height: 0; border-left: 50px solid transparent; border-right: 50px solid transparent; border-bottom: 100px solid rgba(255,255,255,0.15); bottom: 20%; left: 20%; }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes float3D { 0% { transform: translate3d(0,0,0) rotateX(0) rotateY(0); } 50% { transform: translate3d(20px, -20px, 50px) rotateX(180deg) rotateY(90deg); } 100% { transform: translate3d(0,0,0) rotateX(360deg) rotateY(360deg); } }

        #game-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            transform-style: preserve-3d;
        }

        header {
            text-align: center;
            color: white;
            text-shadow: 3px 3px 0px #000;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        h1 { font-family: 'Fredoka One', cursive; font-size: 3rem; margin: 0; letter-spacing: 2px; }
        
        .controls-bar {
            display: flex;
            gap: 15px;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            border: 3px solid white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            font-family: 'Fredoka One', cursive;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 5px 0 rgba(0,0,0,0.2);
            position: relative;
            top: 0;
            color: white;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
        }

        button:active { top: 5px; box-shadow: 0 0 0 rgba(0,0,0,0.2); }
        .btn-reset { background: #e74c3c; border: 2px solid #c0392b; }
        .btn-undo { background: #f39c12; border: 2px solid #d35400; }
        .btn-hint { background: #2ecc71; border: 2px solid #27ae60; }
        .btn-power { background: #9b59b6; border: 2px solid #8e44ad; }

        select {
            padding: 10px;
            border-radius: 25px;
            border: 2px solid white;
            font-family: 'Nunito', sans-serif;
            font-weight: bold;
            background: white;
            cursor: pointer;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 15px;
            border-radius: 20px;
            border: 4px solid #000;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.2);
            transform: rotateX(10deg);
        }

        .player-score {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 900;
            font-size: 1.2rem;
            padding: 10px 20px;
            border-radius: 15px;
            transition: all 0.3s;
            border: 3px solid transparent;
        }

        .player-score.active { transform: scale(1.1); box-shadow: 0 0 20px currentColor; }
        .p1-score { color: var(--p1-outline); background: #fadbd8; border-color: var(--p1-color); }
        .p2-score { color: var(--p2-outline); background: #d6eaf8; border-color: var(--p2-color); }
        
        .token-icon { width: 30px; height: 30px; border-radius: 50%; border: 3px solid black; display: inline-block; box-shadow: inset -5px -5px 10px rgba(0,0,0,0.2); }

        .board-wrapper {
            position: relative;
            padding: 20px 20px 40px 20px;
            background: var(--board-color);
            border-radius: 20px;
            border: 5px solid #000;
            box-shadow: 
                0 20px 0 var(--board-shadow),
                0 30px 40px rgba(0,0,0,0.4);
            transform: rotateX(20deg);
            transition: transform 0.3s;
        }

        .board-wrapper:hover { transform: rotateX(15deg) scale(1.02); }

        .board {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            background: transparent;
        }

        .column {
            display: flex;
            flex-direction: column-reverse;
            gap: 10px;
            cursor: pointer;
            position: relative;
        }

        .column:hover::after {
            content: '▼';
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 2rem;
            text-shadow: 0 0 10px black;
            animation: bounce 1s infinite;
        }

        .cell {
            width: 60px;
            height: 60px;
            background: var(--slot-color);
            border-radius: 50%;
            border: 4px solid #000;
            box-shadow: inset 5px 5px 10px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .piece {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 0;
            border: 4px solid #000;
            box-shadow: 
                inset -5px -5px 15px rgba(0,0,0,0.3),
                5px 5px 10px rgba(0,0,0,0.2);
            animation: dropIn 0.6s cubic-bezier(0.5, 0, 0.5, 1.5) forwards;
            z-index: 2;
        }

        .piece.red { background: var(--p1-color); }
        .piece.blue { background: var(--p2-color); }
        
        .piece::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 20%;
            width: 30%;
            height: 20%;
            border-radius: 50%;
            background: rgba(255,255,255,0.6);
            transform: rotate(-45deg);
        }

        .piece.winner {
            animation: pulseWin 1s infinite alternate;
            z-index: 10;
            box-shadow: 0 0 20px 5px yellow;
        }

        @keyframes dropIn {
            0% { transform: translateY(-600px) rotate(0deg); opacity: 0; }
            60% { transform: translateY(20px) rotate(10deg); opacity: 1; }
            80% { transform: translateY(-10px) rotate(-5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        @keyframes bounce { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-10px); } }
        @keyframes pulseWin { 0% { transform: scale(1); filter: brightness(1); } 100% { transform: scale(1.1); filter: brightness(1.3); } }
        @keyframes popIn { 0% { transform: scale(0); } 80% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px) rotate(-2deg); } 75% { transform: translateX(5px) rotate(2deg); } 100% { transform: translateX(0); } }

        .shake { animation: shake 0.4s ease-in-out; }

        #powerup-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 30px;
            border: 5px solid black;
            text-align: center;
            box-shadow: 20px 20px 0px rgba(0,0,0,0.3);
            animation: popIn 0.3s;
        }
        .power-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .power-card {
            background: #f0f0f0;
            border: 3px solid black;
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .power-card:hover { transform: translateY(-5px); background: #fff; }
        .power-icon { font-size: 2rem; display: block; margin-bottom: 5px; }

        #vfx-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

        @media (max-width: 600px) {
            .cell { width: 40px; height: 40px; }
            h1 { font-size: 2rem; }
            .board-wrapper { padding: 10px; }
            .controls-bar { gap: 5px; padding: 5px; }
            button { padding: 5px 10px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div class="bg-shape shape-cube"></div>
    <div class="bg-shape shape-sphere"></div>
    <div class="bg-shape shape-pyramid"></div>

    <canvas id="vfx-canvas"></canvas>

    <div id="game-container">
        <header>
            <h1>CONNECT 4 <span style="color:#f39c12">3D</span></h1>
        </header>

        <div class="controls-bar">
            <select id="difficulty">
                <option value="easy">Easy (Random)</option>
                <option value="medium" selected>Medium (Smart)</option>
                <option value="hard">Hard (Expert)</option>
                <option value="pvp">2 Player</option>
            </select>
            <button class="btn-undo" onclick="game.undo()">↩ Undo</button>
            <button class="btn-hint" onclick="game.showHint()">💡 Hint</button>
            <button class="btn-power" onclick="game.openPowerUps()">⚡ Power-Ups</button>
            <button class="btn-reset" onclick="game.resetGame()">🔄 Reset</button>
        </div>

        <div class="scoreboard">
            <div id="p1-panel" class="player-score p1-score active">
                <div class="token-icon" style="background: var(--p1-color)"></div>
                <span>P1: <span id="score-p1">0</span></span>
            </div>
            <div style="font-weight:900; font-size:1.5rem; color:#333;">VS</div>
            <div id="p2-panel" class="player-score p2-score">
                <div class="token-icon" style="background: var(--p2-color)"></div>
                <span>P2: <span id="score-p2">0</span></span>
            </div>
        </div>

        <div class="board-wrapper" id="board-wrapper">
            <div class="board" id="board"></div>
        </div>
        
        <div style="color:white; font-weight:bold; text-shadow: 2px 2px 0 #000;" id="status-text">Player 1's Turn!</div>
    </div>

    <div id="powerup-modal">
        <div class="modal-content">
            <h2 style="font-family:'Fredoka One'; margin:0;">CHOOSE POWER-UP</h2>
            <p>Cost: 1 Win</p>
            <div class="power-grid">
                <div class="power-card" onclick="game.activatePower('bomb')">
                    <span class="power-icon">🔥</span>
                    <strong>Bomb</strong><br><small>Clear Column</small>
                </div>
                <div class="power-card" onclick="game.activatePower('freeze')">
                    <span class="power-icon">❄️</span>
                    <strong>Freeze</strong><br><small>Skip Turn</small>
                </div>
                <div class="power-card" onclick="game.activatePower('nuke')">
                    <span class="power-icon">💣</span>
                    <strong>Nuke</strong><br><small>Clear All</small>
                </div>
            </div>
            <button onclick="document.getElementById('powerup-modal').style.display='none'" style="margin-top:20px; background:#ccc; color:#333; border:2px solid #999;">Cancel</button>
        </div>
    </div>

<script>
class VFXSystem {
    constructor() {
        this.canvas = document.getElementById('vfx-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.particles = [];
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.animate();
    }

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    }

    createExplosion(x, y, color) {
        for (let i = 0; i < 30; i++) {
            this.particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 15,
                vy: (Math.random() - 0.5) * 15,
                life: 1.0,
                color: color,
                size: Math.random() * 8 + 4,
                type: 'spark'
            });
        }
    }

    createConfetti() {
        const colors = ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#9b59b6'];
        for (let i = 0; i < 150; i++) {
            this.particles.push({
                x: window.innerWidth / 2,
                y: -20,
                vx: (Math.random() - 0.5) * 20,
                vy: Math.random() * 10 + 5,
                life: 1.0,
                color: colors[Math.floor(Math.random() * colors.length)],
                size: Math.random() * 10 + 5,
                rotation: Math.random() * 360,
                rotationSpeed: (Math.random() - 0.5) * 10,
                type: 'confetti'
            });
        }
    }

    animate() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        for (let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            p.life -= 0.02;
            
            if (p.type === 'spark') {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.5;
                this.ctx.globalAlpha = p.life;
                this.ctx.fillStyle = p.color;
                this.ctx.beginPath();
                this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                this.ctx.fill();
            } else if (p.type === 'confetti') {
                p.x += p.vx;
                p.y += p.vy;
                p.rotation += p.rotationSpeed;
                this.ctx.globalAlpha = p.life;
                this.ctx.save();
                this.ctx.translate(p.x, p.y);
                this.ctx.rotate(p.rotation * Math.PI / 180);
                this.ctx.fillStyle = p.color;
                this.ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                this.ctx.restore();
            }

            if (p.life <= 0 || p.y > this.canvas.height) {
                this.particles.splice(i, 1);
            }
        }
        requestAnimationFrame(() => this.animate());
    }
}

class Connect4 {
    constructor() {
        this.rows = 6;
        this.cols = 7;
        this.board = [];
        this.currentPlayer = 1;
        this.gameActive = true;
        this.scores = { 1: 0, 2: 0 };
        this.history = [];
        this.vfx = new VFXSystem();
        this.difficulty = 'medium';
        this.selectedPower = null;
        
        this.initBoard();
        this.setupInputs();
        this.updateUI();
    }

    initBoard() {
        this.board = Array(this.rows).fill().map(() => Array(this.cols).fill(0));
        const boardEl = document.getElementById('board');
        boardEl.innerHTML = '';
        
        for (let c = 0; c < this.cols; c++) {
            const colEl = document.createElement('div');
            colEl.className = 'column';
            colEl.dataset.col = c;
            colEl.onclick = () => this.handleMove(c);
            
            for (let r = 0; r < this.rows; r++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = r;
                cell.dataset.col = c;
                colEl.appendChild(cell);
            }
            boardEl.appendChild(colEl);
        }
    }

    setupInputs() {
        document.getElementById('difficulty').addEventListener('change', (e) => {
            this.difficulty = e.target.value;
            this.resetGame();
        });

        document.addEventListener('keydown', (e) => {
            if (!this.gameActive || (this.difficulty !== 'pvp' && this.currentPlayer === 2)) return;
            if (e.key >= '1' && e.key <= '7') {
                this.handleMove(parseInt(e.key) - 1);
            }
            if (e.ctrlKey && e.key === 'z') this.undo();
        });
    }

    handleMove(colIndex) {
        if (!this.gameActive) return;
        if (this.difficulty !== 'pvp' && this.currentPlayer === 2) return;

        if (this.selectedPower) {
            this.executePowerUpLogic(colIndex);
            return;
        }

        const row = this.getAvailableRow(colIndex);
        if (row === -1) {
            const wrapper = document.getElementById('board-wrapper');
            wrapper.classList.add('shake');
            setTimeout(() => wrapper.classList.remove('shake'), 400);
            return;
        }

        this.makeMove(row, colIndex);
    }

    getAvailableRow(col) {
        for (let r = 0; r < this.rows; r++) {
            if (this.board[r][col] === 0) return r;
        }
        return -1;
    }

    makeMove(row, col, isAI = false) {
        this.history.push(JSON.parse(JSON.stringify(this.board)));
        
        this.board[row][col] = this.currentPlayer;
        this.renderPiece(row, col);
        
        const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
        const rect = cell.getBoundingClientRect();
        const color = this.currentPlayer === 1 ? '#e74c3c' : '#3498db';
        this.vfx.createExplosion(rect.left + rect.width/2, rect.top + rect.height/2, color);

        if (this.checkWin(row, col)) {
            this.endGame(true);
        } else if (this.checkDraw()) {
            this.endGame(false);
        } else {
            this.switchTurn();
            if (!this.gameActive) return;
            
            if (this.difficulty !== 'pvp' && this.currentPlayer === 2) {
                setTimeout(() => this.aiMove(), 600);
            }
        }
    }

    renderPiece(row, col) {
        const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
        const piece = document.createElement('div');
        piece.className = `piece ${this.currentPlayer === 1 ? 'red' : 'blue'}`;
        cell.appendChild(piece);
    }

    switchTurn() {
        this.currentPlayer = this.currentPlayer === 1 ? 2 : 1;
        this.updateUI();
    }

    updateUI() {
        document.getElementById('score-p1').innerText = this.scores[1];
        document.getElementById('score-p2').innerText = this.scores[2];
        
        const p1Panel = document.getElementById('p1-panel');
        const p2Panel = document.getElementById('p2-panel');
        const status = document.getElementById('status-text');
        
        if (this.currentPlayer === 1) {
            p1Panel.classList.add('active');
            p2Panel.classList.remove('active');
            status.innerText = "Player 1's Turn!";
            status.style.color = "#e74c3c";
        } else {
            p1Panel.classList.remove('active');
            p2Panel.classList.add('active');
            status.innerText = this.difficulty === 'pvp' ? "Player 2's Turn!" : "Computer Thinking...";
            status.style.color = "#3498db";
        }
    }

    checkWin(r, c) {
        const player = this.board[r][c];
        const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];

        for (let [dr, dc] of directions) {
            let count = 1;
            let winningCells = [[r,c]];

            for (let i = 1; i < 4; i++) {
                const nr = r + dr * i, nc = c + dc * i;
                if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols && this.board[nr][nc] === player) {
                    count++;
                    winningCells.push([nr, nc]);
                } else break;
            }
            for (let i = 1; i < 4; i++) {
                const nr = r - dr * i, nc = c - dc * i;
                if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols && this.board[nr][nc] === player) {
                    count++;
                    winningCells.push([nr, nc]);
                } else break;
            }

            if (count >= 4) {
                this.highlightWin(winningCells);
                return true;
            }
        }
        return false;
    }

    highlightWin(cells) {
        cells.forEach(([r, c]) => {
            const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"] .piece`);
            if (cell) cell.classList.add('winner');
        });
    }

    checkDraw() {
        return this.board.every(row => row.every(cell => cell !== 0));
    }

    endGame(isWin) {
        this.gameActive = false;
        if (isWin) {
            this.scores[this.currentPlayer]++;
            this.vfx.createConfetti();
            document.getElementById('status-text').innerText = `PLAYER ${this.currentPlayer} WINS!`;
            document.body.style.animation = "pulseWin 0.5s";
            setTimeout(() => document.body.style.animation = "", 500);
        } else {
            document.getElementById('status-text').innerText = "IT'S A DRAW!";
        }
        this.updateUI();
    }

    resetGame() {
        this.board = Array(this.rows).fill().map(() => Array(this.cols).fill(0));
        this.history = [];
        this.gameActive = true;
        this.currentPlayer = 1;
        const boardEl = document.getElementById('board');
        boardEl.innerHTML = '';
        for (let c = 0; c < this.cols; c++) {
            const colEl = document.createElement('div');
            colEl.className = 'column';
            colEl.dataset.col = c;
            colEl.onclick = () => this.handleMove(c);
            for (let r = 0; r < this.rows; r++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = r;
                cell.dataset.col = c;
                colEl.appendChild(cell);
            }
            boardEl.appendChild(colEl);
        }
        this.updateUI();
    }

    undo() {
        if (this.history.length === 0 || !this.gameActive) return;
        
        let steps = (this.difficulty !== 'pvp') ? 2 : 1;
        if (this.history.length < steps) steps = this.history.length;

        while(steps > 0) {
            this.board = this.history.pop();
            steps--;
        }
        
        const cells = document.querySelectorAll('.cell');
        cells.forEach(cell => cell.innerHTML = '');
        
        for(let r=0; r<this.rows; r++){
            for(let c=0; c<this.cols; c++){
                if(this.board[r][c] !== 0){
                    this.renderPiece(r,c);
                }
            }
        }
        
        const totalPieces = this.board.flat().filter(x => x !== 0).length;
        this.currentPlayer = (totalPieces % 2 === 0) ? 1 : 2;
        
        this.gameActive = true;
        this.updateUI();
    }

    aiMove() {
        if (!this.gameActive) return;
        
        let col = -1;
        
        if (this.difficulty === 'easy') {
            const validCols = [];
            for(let c=0; c<this.cols; c++) if(this.getAvailableRow(c) !== -1) validCols.push(c);
            col = validCols[Math.floor(Math.random() * validCols.length)];
        } else {
            col = this.findBestMove();
        }

        if (col !== -1) {
            const row = this.getAvailableRow(col);
            this.makeMove(row, col, true);
        }
    }

    findBestMove() {
        for (let c = 0; c < this.cols; c++) {
            const r = this.getAvailableRow(c);
            if (r !== -1) {
                this.board[r][c] = 2;
                if (this.checkWinSilent(r, c)) { this.board[r][c] = 0; return c; }
                this.board[r][c] = 0;
            }
        }
        for (let c = 0; c < this.cols; c++) {
            const r = this.getAvailableRow(c);
            if (r !== -1) {
                this.board[r][c] = 1;
                if (this.checkWinSilent(r, c)) { this.board[r][c] = 0; return c; }
                this.board[r][c] = 0;
            }
        }
        if (this.getAvailableRow(3) !== -1) return 3;
        
        const validCols = [];
        for(let c=0; c<this.cols; c++) if(this.getAvailableRow(c) !== -1) validCols.push(c);
        return validCols[Math.floor(Math.random() * validCols.length)];
    }

    checkWinSilent(r, c) {
        const player = this.board[r][c];
        const directions = [[0,1],[1,0],[1,1],[1,-1]];
        for (let [dr, dc] of directions) {
            let count = 1;
            for (let i = 1; i < 4; i++) {
                const nr = r + dr*i, nc = c + dc*i;
                if (nr>=0 && nr<this.rows && nc>=0 && nc<this.cols && this.board[nr][nc]===player) count++;
                else break;
            }
            for (let i = 1; i < 4; i++) {
                const nr = r - dr*i, nc = c - dc*i;
                if (nr>=0 && nr<this.rows && nc>=0 && nc<this.cols && this.board[nr][nc]===player) count++;
                else break;
            }
            if (count >= 4) return true;
        }
        return false;
    }

    openPowerUps() {
        if (!this.gameActive) return;
        document.getElementById('powerup-modal').style.display = 'flex';
    }

    activatePower(type) {
        this.selectedPower = type;
        document.getElementById('powerup-modal').style.display = 'none';
        document.getElementById('status-text').innerText = `Select a column for ${type.toUpperCase()}!`;
        document.body.style.cursor = 'crosshair';
    }

    executePowerUpLogic(col) {
        const type = this.selectedPower;
        this.selectedPower = null;
        document.body.style.cursor = 'default';

        if (type === 'bomb') {
            let hasPieces = false;
            for(let r=0; r<this.rows; r++) {
                if(this.board[r][col] !== 0) {
                    hasPieces = true;
                    this.board[r][col] = 0;
                    const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${col}"]`);
                    if(cell) cell.innerHTML = '';
                    this.vfx.createExplosion(window.innerWidth/2, window.innerHeight/2, '#e74c3c');
                }
            }
            if(!hasPieces) {
                alert("Column is empty!");
                this.selectedPower = type;
                return;
            }
        } else if (type === 'nuke') {
            this.board = Array(this.rows).fill().map(() => Array(this.cols).fill(0));
            document.querySelectorAll('.cell').forEach(c => c.innerHTML = '');
            this.vfx.createConfetti();
        } else if (type === 'freeze') {
            this.updateUI();
            return; 
        }
        this.switchTurn();
    }

    showHint() {
        if(!this.gameActive) return;
        const bestCol = this.findBestMove();
        if(bestCol !== -1) {
            const colEl = document.querySelector(`.column[data-col="${bestCol}"]`);
            colEl.style.boxShadow = "0 0 20px 5px #2ecc71";
            setTimeout(() => colEl.style.boxShadow = "none", 1000);
        }
    }
}

const game = new Connect4();
</script>

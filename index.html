<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect 4 - Ultimate Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Animated Background -->
    <div class="bg-animation">
      <div class="bg-layer bg-layer-1"></div>
      <div class="bg-layer bg-layer-2"></div>
      <div class="bg-layer bg-layer-3"></div>
    </div>

    <!-- Main Game Container -->
    <div class="game-container">
      <!-- Header -->
      <header class="game-header">
        <h1 class="game-title">
          <span class="title-text">CONNECT</span>
          <span class="title-accent">FOUR</span>
        </h1>
        <div class="subtitle">ULTIMATE EDITION</div>
      </header>

      <!-- Scoreboard -->
      <div class="scoreboard">
        <div class="player-score player-1-score" id="player1ScoreBox">
          <div class="player-token token-p1"></div>
          <div class="score-info">
            <span class="player-name">PLAYER 1</span>
            <span class="score-value" id="player1Score">0</span>
          </div>
        </div>
        
        <div class="vs-badge">VS</div>
        
        <div class="player-score player-2-score" id="player2ScoreBox">
          <div class="player-token token-p2"></div>
          <div class="score-info">
            <span class="player-name">PLAYER 2</span>
            <span class="score-value" id="player2Score">0</span>
          </div>
        </div>
      </div>

      <!-- Turn Indicator -->
      <div class="turn-indicator" id="turnIndicator">
        <div class="turn-arrow"></div>
        <span class="turn-text">PLAYER <span id="currentPlayerNum">1</span>'S TURN</span>
      </div>

      <!-- Game Board -->
      <div class="board-wrapper">
        <div class="board-frame">
          <div class="board-top-bar"></div>
          <div class="column-indicators">
            <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span>
          </div>
          <div class="container" role="grid" aria-label="Connect 4 Game Board"></div>
          <div class="board-bottom-bar"></div>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="control-btn" id="undoBtn" aria-label="Undo last move">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 10h10a5 5 0 0 1 5 5v2M3 10l6-6M3 10l6 6"/>
          </svg>
          <span>UNDO</span>
        </button>
        <button class="control-btn" id="resetBtn" aria-label="Reset game">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
          <span>RESET</span>
        </button>
        <button class="control-btn primary" id="newGameBtn" aria-label="Start new game">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"/>
          </svg>
          <span>NEW GAME</span>
        </button>
      </div>

      <!-- Move History -->
      <div class="move-history">
        <h3>MOVE HISTORY</h3>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>

    <!-- Start/End Modal -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-content">
        <div class="modal-icon" id="modalIcon"></div>
        <h2 class="modal-title" id="modalTitle">CONNECT FOUR</h2>
        <p class="modal-subtitle" id="modalSubtitle">Ready to play?</p>
        <button class="modal-btn" id="startBtn">
          <span class="btn-text">START GAME</span>
          <span class="btn-shine"></span>
        </button>
      </div>
    </div>

    <!-- VFX Containers -->
    <div id="particles"></div>
    <div id="confetti"></div>
    <div class="screen-flash" id="screenFlash"></div>

    <script src="script.js"></script>
  </body>
</html>
